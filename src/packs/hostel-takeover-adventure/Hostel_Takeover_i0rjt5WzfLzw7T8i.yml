      details:
        description: >-
          <p>Agnes is Pascale’s wife. She’s a devout member of the Cyberchurch
          and a true believer. Most of the upgrades downstairs were won with her
          high Piety Score. Turning in a family member would earn her enough
          points for another upgrade.</p>

          <p>Agnes’ neck and spine are cyberware, an elective upgrade she took
          to improve her posture. She wants to summon the Church Police to the
          hostel as soon as possible. She’s uncooperative once it’s apparent the
          Storm Knights are against Malraux. She loves her husband, but not
          enough to overlook his recent blasphemous behavior.</p>

          <p><strong>Quote:</strong> “We must call the Church Police. It’s for
          Constance’s soul. The extra points are just a bonus!”</p>
        sizeBonus: normal
        clearance: alpha
        possibilityPotential: Never
